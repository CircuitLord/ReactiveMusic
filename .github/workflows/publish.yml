name: Publish

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Release channel"
        type: choice
        options:
          - release
          - beta
          - alpha
        default: release
      loader:
        description: "Loader targets to publish"
        type: choice
        options:
          - all
          - fabric
          - forge
          - neoforge
        default: all
      publish_modrinth:
        description: "Publish to Modrinth"
        type: boolean
        default: true
      publish_curseforge:
        description: "Publish to CurseForge"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-matrix:
    name: Resolve publish targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Resolve matrix
        id: matrix
        env:
          SELECTED_LOADER: ${{ inputs.loader }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          targets = [
              {"loader": "fabric", "mc": "1.19.2", "game_versions": "1.19.2", "curseforge_game_versions": "1.19.2", "java": 17},
              {"loader": "forge", "mc": "1.19.2", "game_versions": "1.19.2", "curseforge_game_versions": "1.19.2", "java": 17},
              {"loader": "fabric", "mc": "1.20.1", "game_versions": ">=1.20 <=1.20.1", "curseforge_game_versions": "1.20.1", "java": 17},
              {"loader": "forge", "mc": "1.20.1", "game_versions": ">=1.20 <=1.20.1", "curseforge_game_versions": "1.20.1", "java": 17},
              {"loader": "fabric", "mc": "1.21.1", "game_versions": ">=1.21 <=1.21.1", "curseforge_game_versions": "1.21.1", "java": 21},
              {"loader": "neoforge", "mc": "1.21.1", "game_versions": ">=1.21 <=1.21.1", "curseforge_game_versions": "1.21.1", "java": 21},
              {"loader": "fabric", "mc": "1.21.11", "game_versions": ">=1.21.9 <=1.21.12", "curseforge_game_versions": "1.21.11", "java": 21},
          ]

          selected_loader = os.environ["SELECTED_LOADER"]
          selected = targets if selected_loader == "all" else [target for target in targets if target["loader"] == selected_loader]
          print(f"matrix={json.dumps({'include': selected}, separators=(',', ':'))}")
          PY

  publish:
    name: Publish ${{ matrix.loader }} ${{ matrix.mc }}
    needs: resolve-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release metadata
        id: meta
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          set -euo pipefail

          mod_version="$(grep '^mod.version=' gradle.properties | cut -d= -f2-)"
          modrinth_project="${MODRINTH_PROJECT_ID:-reactive-music}"
          curseforge_project="${CURSEFORGE_PROJECT_ID:-}"

          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "modrinth_project=$modrinth_project" >> "$GITHUB_OUTPUT"
          echo "curseforge_project=$curseforge_project" >> "$GITHUB_OUTPUT"

      - name: Validate publishing credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ steps.meta.outputs.curseforge_project }}
        run: |
          set -euo pipefail

          if [ "${{ inputs.publish_modrinth }}" = "true" ] && [ -z "$MODRINTH_TOKEN" ]; then
            echo "MODRINTH_TOKEN secret is required when publish_modrinth is enabled." >&2
            exit 1
          fi

          if [ "${{ inputs.publish_curseforge }}" = "true" ]; then
            if [ -z "$CURSEFORGE_TOKEN" ]; then
              echo "CURSEFORGE_TOKEN secret is required when publish_curseforge is enabled." >&2
              exit 1
            fi
            if [ -z "$CURSEFORGE_PROJECT_ID" ]; then
              echo "CURSEFORGE_PROJECT_ID repository variable is required when publish_curseforge is enabled." >&2
              exit 1
            fi
          fi

      - name: Build ${{ matrix.loader }} jars
        env:
          LOADER: ${{ matrix.loader }}
        run: |
          chmod +x ./gradlew
          case "$LOADER" in
            fabric) task=chiseledBuildFabric ;;
            forge) task=chiseledBuildForge ;;
            neoforge) task=chiseledBuildNeoforge ;;
            *) echo "Unknown loader: $LOADER" >&2; exit 1 ;;
          esac
          ./gradlew --no-daemon --no-parallel "$task"

      - name: Publish to Modrinth
        if: ${{ inputs.publish_modrinth }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.meta.outputs.modrinth_project }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: build/libs/${{ steps.meta.outputs.mod_version }}/${{ matrix.loader }}/reactivemusic-${{ matrix.loader }}-${{ steps.meta.outputs.mod_version }}+${{ matrix.mc }}.jar
          version: ${{ steps.meta.outputs.mod_version }}+${{ matrix.mc }}-${{ matrix.loader }}
          version-type: ${{ inputs.version_type }}

          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.game_versions }}
          game-version-filter: none
          java: ${{ matrix.java }}

          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail

      - name: Publish to CurseForge
        if: ${{ inputs.publish_curseforge }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ steps.meta.outputs.curseforge_project }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: build/libs/${{ steps.meta.outputs.mod_version }}/${{ matrix.loader }}/reactivemusic-${{ matrix.loader }}-${{ steps.meta.outputs.mod_version }}+${{ matrix.mc }}.jar
          name: v${{ steps.meta.outputs.mod_version }}+${{ matrix.mc }}-${{ matrix.loader }}
          version: ${{ steps.meta.outputs.mod_version }}+${{ matrix.mc }}-${{ matrix.loader }}
          version-type: ${{ inputs.version_type }}

          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.curseforge_game_versions }}
          game-version-filter: none
          java: ${{ matrix.java }}

          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail
